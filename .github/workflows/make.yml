name: Main workflow

# Same as lint.yml: both events fire for a branch pushed here, so a PR commit
# ran two identical sets of jobs (#349). Restricting push to the default branch
# leaves pull_request covering the PR and push covering the merge.
on:
  push:
    branches: [master]
  pull_request:

# Cancels the run still going when the next commit lands on the same ref. It
# does not deduplicate push against pull_request -- github.ref differs between
# the two events, so they never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 10
    strategy:
      # Report both platforms even when one fails; the Makefile hits GNU vs BSD
      # differences (ln, mktemp) that are only visible per-OS.
      fail-fast: false
      matrix:
        os: [macOS-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      # Exercises dotfiles/config/claude/unlink against a throwaway $HOME and
      # asserts on the symlinks produced, not just on make's exit status.
      - name: Run Makefile tests
        run: bats test/makefile.bats

      # Still run the real thing against the runner's own $HOME, so the
      # everyday `make` path stays covered on both platforms.
      - name: Run Make
        run: make
