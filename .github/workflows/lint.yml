name: Lint and test

# `on: [push, pull_request]` fires both events for a branch pushed to this
# repository, so every commit on a PR ran two full sets of jobs -- and they can
# disagree, leaving the same job name green in one set and red in the other
# (#324). Restricting push to the default branch is what actually stops it:
# a PR is covered by pull_request, and master is covered after the merge.
on:
  push:
    branches: [master]
  pull_request:

# This does NOT deduplicate the two events, and used to claim it did (#349):
# the group keys on github.ref, which is refs/heads/<branch> for a push and
# refs/pull/<n>/merge for a pull_request, so they land in different groups and
# both survive. What it does do is cancel the run still going when the next
# commit lands on the same ref -- which is the force-push case.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update; sudo apt-get install zsh
      - name: Check Zshrc Syntax
        run: zsh -n ./.zshrc
      # Each module on its own, so a syntax error is reported against the file
      # that has it rather than against the loader.
      - name: Check zsh module syntax
        run: |
          for f in .zsh/*.zsh; do
            echo "==> $f"
            zsh -n "$f"
          done
      - name: Check Zshrc Commands
        run: zsh -c "source ./.zshrc"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run shellcheck on .scripts
        run: shellcheck .scripts/* install.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # The Windows scripts were the only ones nothing checked. pwsh is preinstalled
  # on ubuntu-latest and parsing does not need Windows, so no Windows runner.
  powershell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $path = Resolve-Path -Relative $_.FullName
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed++
              foreach ($e in $errors) {
                Write-Host "::error file=$path,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "ok $path"
            }
          }
          exit $failed
      # Warnings are printed but do not fail the build; only Error-severity
      # findings do. Tighten this once the warning list has been triaged.
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse)
          if ($results.Count -eq 0) {
            Write-Host "PSScriptAnalyzer: no findings"
          } else {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          }
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          Write-Host "$($errors.Count) error-severity finding(s)"
          if ($errors.Count -gt 0) { exit 1 }

  bats:
    runs-on: ubuntu-latest
    # These tests spawn shells; a shell that blocks on a read would otherwise
    # hold the runner for hours. The whole job takes well under a minute.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install bats, lsof, tmux, zsh and fish
        run: sudo apt-get update && sudo apt-get install -y bats lsof tmux zsh fish
      # Every suite, found rather than listed. Naming them one step at a time
      # meant a new test/*.bats ran nowhere until someone remembered to add a
      # step, and a suite that never runs looks exactly like a suite that
      # passes. What each one covers is in its own header comment, and in
      # test/README.md.
      #
      # makefile.bats runs here as well as in make.yml, which is where it has
      # to be to cover macOS. A couple of seconds, against the cost of the
      # glob having an exception in it.
      - name: Run bats suites
        run: |
          shopt -s nullglob
          suites=(test/*.bats)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no bats suites found under test/"
            exit 1
          fi
          printf 'running: %s\n' "${suites[@]}"
          bats "${suites[@]}"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
