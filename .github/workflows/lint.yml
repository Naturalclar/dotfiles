name: Check Zshrc syntax

on: [push, pull_request]

# push and pull_request both fire for a PR branch, so without this every commit
# starts two identical sets of runs and a force-push leaves the old ones going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install zsh
        run: sudo apt-get update; sudo apt-get install zsh
      - name: Check Zshrc Syntax
        run: zsh -n ./.zshrc
      # Each module on its own, so a syntax error is reported against the file
      # that has it rather than against the loader.
      - name: Check zsh module syntax
        run: |
          for f in .zsh/*.zsh; do
            echo "==> $f"
            zsh -n "$f"
          done
      - name: Check Zshrc Commands
        run: zsh -c "source ./.zshrc"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run shellcheck on .scripts
        run: shellcheck .scripts/* install.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  bats:
    runs-on: ubuntu-latest
    # These tests spawn shells; a shell that blocks on a read would otherwise
    # hold the runner for hours. The whole job takes well under a minute.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bats, lsof, tmux, zsh and fish
        run: sudo apt-get update && sudo apt-get install -y bats lsof tmux zsh fish
      - name: Run script tests
        run: bats test/scripts.bats
      # Keeps the shells from drifting apart again: .zshrc is the source of
      # truth, and an alias present in both must mean the same thing.
      - name: Run alias tests
        run: bats test/aliases.bats
      # zsh -n only checks syntax; these check what the prompt actually renders.
      - name: Run prompt tests
        run: bats test/prompt.bats
      # .scripts on PATH and the UTF-8 locale both fail silently when missing.
      - name: Run fish config tests
        run: bats test/fish-config.bats

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
